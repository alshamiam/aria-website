name: Import academy photos from Drive
on:
  workflow_dispatch:
  push:
    branches: [photos-import]
    paths: ['.github/workflows/import-photos.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip3 install --quiet gdown
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick

      - name: Download originals from Drive
        run: |
          mkdir -p /tmp/orig
          set -e
          fail=0
          while read -r num id; do
            echo "== Photo $num =="
            gdown "$id" -O "/tmp/orig/aria-$num.jpg" || { echo "FAILED $num"; fail=1; }
          done <<'EOF'
          01 1Xb1yS9ETCOWAbiF0rlrzKu3gGGM9VJ2j
          02 1KQuxJgOZRKsfAmJKUQr0dGDIK1yNkilI
          03 1VRtMkCuPldV26sCw_qap29CKrQVi-_qk
          04 1R-sI_GFBXhmsvx_ZixXbZmiqmSn8L3nu
          05 1R8rhysRQX_6ewuJ3LPIchuLSVb1Hpw_Z
          06 1vri6IEfpghBvLgSrObhtke3lciwZpOlW
          07 17o9CRqhBPtIJVEJn2_x3tmKc7gsk_mrV
          08 1veNgEYIPoh6me19e6rpRQkzhmuNrpPVQ
          09 1mZqmLx0UDfy0EQMl1VWFRpz2ko6yy_eb
          10 1Mt_J7ZHiwi1qcOwmiDWXokUQqvOK-1P1
          11 17VQfOUGp8rZVRtS7IU_D29YemTVT-iVk
          12 1hIN2wRllt5ROQLTZa4D5u0bwmYfXJX_Y
          13 1zDC1J7K08-QIyoV39nqptCUj-X1nJpQB
          14 1R5kFcvbpL71gwZv9IGi93PSA8TYKQnir
          15 1oJE4opeLimgbkx9dazNxa1LLjPG_F1E4
          16 1X_A_wjinm1exbMqLbrUSThvIX0uqY4Mt
          17 1GVBt-8aPAFvHwvTp1HOpHDtepUhTQ-pn
          EOF
          ls -la /tmp/orig
          exit $fail

      - name: Generate 800/1600 JPG + WebP variants
        run: |
          set -e
          mkdir -p photos-optimized
          : > photos-optimized/manifest.txt
          for f in /tmp/orig/aria-*.jpg; do
            base=$(basename "$f" .jpg)
            convert "$f" -auto-orient -strip -resize '1600x1600>' -quality 82 "photos-optimized/${base}-1600.jpg"
            convert "$f" -auto-orient -strip -resize '800x800>'   -quality 82 "photos-optimized/${base}-800.jpg"
            cwebp -quiet -q 80 "photos-optimized/${base}-1600.jpg" -o "photos-optimized/${base}-1600.webp"
            cwebp -quiet -q 80 "photos-optimized/${base}-800.jpg"  -o "photos-optimized/${base}-800.webp"
            identify -format "%f %w %h\n" "photos-optimized/${base}-1600.jpg" >> photos-optimized/manifest.txt
          done
          du -sh photos-optimized

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos-optimized
          git commit -m "Add web-optimized academy photos (from Drive import)"
          git push origin HEAD
